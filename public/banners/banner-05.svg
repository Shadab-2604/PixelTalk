<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" shape-rendering="crispEdges">
  <title>PixelTalk DJ Beatbox Profile Banner</title>
  <desc>Matching pixel synthwave soundstage banner for avatar-05</desc>
  <defs>
    <linearGradient id="synthBg05" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E140B"/>
      <stop offset="50%" stop-color="#1B2615"/>
      <stop offset="100%" stop-color="#0A0F08"/>
    </linearGradient>
    <linearGradient id="eqGlow05" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#597928"/>
      <stop offset="70%" stop-color="#91AC67"/>
      <stop offset="100%" stop-color="#D0EDA1"/>
    </linearGradient>
  </defs>

  <!-- Dark Cyber Stage Background -->
  <g id="background">
    <rect width="1500" height="500" fill="url(#synthBg05)"/>
  </g>

  <!-- Synthwave Lime Neon Horizon Grid -->
  <g id="neon-grid" stroke="#91AC67" stroke-width="2" opacity="0.3">
    <line x1="0" y1="360" x2="1500" y2="360"/>
    <line x1="0" y1="400" x2="1500" y2="400"/>
    <line x1="0" y1="440" x2="1500" y2="440"/>
    <line x1="0" y1="480" x2="1500" y2="480"/>
    <line x1="200" y1="340" x2="0" y2="500"/>
    <line x1="500" y1="340" x2="350" y2="500"/>
    <line x1="800" y1="340" x2="750" y2="500"/>
    <line x1="1100" y1="340" x2="1150" y2="500"/>
    <line x1="1400" y1="340" x2="1500" y2="500"/>
  </g>

  <!-- Dynamic Pixel Audio Equalizer Bars (Right Side Concentration) -->
  <g id="equalizer-bars">
    <!-- Bar 1 -->
    <rect x="950" y="180" width="24" height="160" fill="url(#eqGlow05)"/>
    <!-- Bar 2 -->
    <rect x="990" y="120" width="24" height="220" fill="url(#eqGlow05)"/>
    <!-- Bar 3 -->
    <rect x="1030" y="220" width="24" height="120" fill="url(#eqGlow05)"/>
    <!-- Bar 4 -->
    <rect x="1070" y="80" width="24" height="260" fill="url(#eqGlow05)"/>
    <!-- Bar 5 -->
    <rect x="1110" y="140" width="24" height="200" fill="url(#eqGlow05)"/>
    <!-- Bar 6 -->
    <rect x="1150" y="240" width="24" height="100" fill="url(#eqGlow05)"/>
    <!-- Bar 7 -->
    <rect x="1190" y="100" width="24" height="240" fill="url(#eqGlow05)"/>
    <!-- Bar 8 -->
    <rect x="1230" y="190" width="24" height="150" fill="url(#eqGlow05)"/>
    <!-- Bar 9 -->
    <rect x="1270" y="260" width="24" height="80" fill="url(#eqGlow05)"/>

    <!-- Peak Indicator Dots (Hot Lime Glow) -->
    <g fill="#D0EDA1">
      <rect x="950" y="160" width="24" height="8"/>
      <rect x="990" y="100" width="24" height="8"/>
      <rect x="1030" y="200" width="24" height="8"/>
      <rect x="1070" y="60" width="24" height="8"/>
      <rect x="1110" y="120" width="24" height="8"/>
      <rect x="1150" y="220" width="24" height="8"/>
      <rect x="1190" y="80" width="24" height="8"/>
      <rect x="1230" y="170" width="24" height="8"/>
      <rect x="1270" y="240" width="24" height="8"/>
    </g>
  </g>

  <!-- Concentric Speaker Pulse Rings (Mid Left Backdrop) -->
  <g id="speaker-pulse" fill="none" stroke="#597928" opacity="0.3" stroke-width="4">
    <circle cx="350" cy="200" r="80"/>
    <circle cx="350" cy="200" r="140"/>
    <circle cx="350" cy="200" r="200"/>
  </g>

  <!-- Dark Floor & Avatar Overlap Zone (Bottom Left) -->
  <g id="stage-floor">
    <rect x="0" y="420" width="1500" height="80" fill="#090E07"/>
    <rect x="0" y="380" width="600" height="40" fill="#141E10"/>
  </g>
</svg>
