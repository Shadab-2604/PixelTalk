<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" shape-rendering="crispEdges">
  <title>PixelTalk Grass Golem Profile Banner</title>
  <desc>Matching pixel sacred sanctuary banner for avatar-06</desc>
  <defs>
    <linearGradient id="mistSky06" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C5D9C0"/>
      <stop offset="50%" stop-color="#E4ECE0"/>
      <stop offset="85%" stop-color="#A4BCA0"/>
      <stop offset="100%" stop-color="#597928"/>
    </linearGradient>
    <radialGradient id="sporeGlow06" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D0EDA1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#91AC67" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Soft Misty Mountain Valley Sky -->
  <g id="sky">
    <rect width="1500" height="500" fill="url(#mistSky06)"/>

    <!-- Soft Pixel Cloud Mist Layer -->
    <g fill="#F4F8F3" opacity="0.6">
      <rect x="100" y="80" width="300" height="40"/>
      <rect x="180" y="50" width="180" height="30"/>
      <rect x="700" y="100" width="350" height="50"/>
      <rect x="1100" y="60" width="280" height="40"/>
    </g>
  </g>

  <!-- Ancient Mossy Monoliths (Right Side) -->
  <g id="monoliths">
    <!-- Main Giant Monolith -->
    <rect x="1150" y="140" width="120" height="360" fill="#585D51"/>
    <rect x="1170" y="140" width="80" height="360" fill="#747969"/>
    <!-- Moss Patch on Monolith -->
    <rect x="1150" y="160" width="40" height="90" fill="#597928"/>
    <rect x="1170" y="180" width="60" height="50" fill="#91AC67"/>
    <rect x="1230" y="280" width="40" height="110" fill="#597928"/>

    <!-- Secondary Monolith -->
    <rect x="980" y="220" width="80" height="280" fill="#484E43"/>
    <rect x="995" y="220" width="50" height="280" fill="#585D51"/>
    <rect x="980" y="240" width="30" height="60" fill="#597928"/>
  </g>

  <!-- Distant Misty Hills (Sage & Slate) -->
  <g id="misty-hills" fill="#6A7A66" opacity="0.7">
    <polygon points="100,500 350,280 600,500"/>
    <polygon points="450,500 700,320 950,500"/>
  </g>

  <!-- Glowing Spore Aura (Center Right) -->
  <g id="spore-glow">
    <circle cx="1100" cy="240" r="180" fill="url(#sporeGlow06)"/>
    <!-- Floating Glowing Spores -->
    <g fill="#D0EDA1">
      <rect x="1050" y="180" width="10" height="10"/>
      <rect x="1120" y="120" width="8" height="8"/>
      <rect x="1220" y="200" width="12" height="12"/>
      <rect x="950" y="260" width="8" height="8"/>
      <rect x="880" y="210" width="6" height="6"/>
      <rect x="760" y="270" width="10" height="10"/>
    </g>
  </g>

  <!-- Ancient Sacred Earth Floor & Overlap Zone (Bottom Left) -->
  <g id="earth-floor">
    <rect x="0" y="380" width="1500" height="120" fill="#3E4F28"/>
    <rect x="0" y="420" width="1500" height="80" fill="#2E3C1D"/>
    <!-- Grass Patches -->
    <rect x="80" y="366" width="12" height="14" fill="#91AC67"/>
    <rect x="220" y="368" width="10" height="12" fill="#91AC67"/>
    <rect x="420" y="364" width="14" height="16" fill="#91AC67"/>
  </g>
</svg>
