<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" shape-rendering="crispEdges">
  <title>PixelTalk Cyber Miner Profile Banner</title>
  <desc>Matching pixel cavern banner for avatar-02</desc>
  <defs>
    <linearGradient id="cavernBg02" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14100B"/>
      <stop offset="50%" stop-color="#241B12"/>
      <stop offset="100%" stop-color="#100C08"/>
    </linearGradient>
    <linearGradient id="amberGlow02" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#DFA035" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#FFC04D" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#DFA035" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Dark Obsidian Cavern Background -->
  <g id="background">
    <rect width="1500" height="500" fill="url(#cavernBg02)"/>
  </g>

  <!-- Cyber Horizon Amber Grid -->
  <g id="cyber-grid" stroke="#DFA035" stroke-width="2" opacity="0.25">
    <line x1="0" y1="380" x2="1500" y2="380"/>
    <line x1="0" y1="420" x2="1500" y2="420"/>
    <line x1="0" y1="460" x2="1500" y2="460"/>
    <line x1="100" y1="350" x2="0" y2="500"/>
    <line x1="300" y1="350" x2="150" y2="500"/>
    <line x1="500" y1="350" x2="400" y2="500"/>
    <line x1="700" y1="350" x2="680" y2="500"/>
    <line x1="900" y1="350" x2="920" y2="500"/>
    <line x1="1100" y1="350" x2="1180" y2="500"/>
    <line x1="1300" y1="350" x2="1420" y2="500"/>
  </g>

  <!-- Cavern Ceiling Stalactites (Pixel Basalt Columns) -->
  <g id="stalactites" fill="#2E2217">
    <rect x="0" y="0" width="1500" height="40"/>
    <rect x="80" y="40" width="40" height="80"/>
    <rect x="90" y="120" width="20" height="40"/>
    <rect x="240" y="40" width="60" height="110"/>
    <rect x="255" y="150" width="30" height="50"/>
    <rect x="500" y="40" width="80" height="70"/>
    <rect x="850" y="40" width="50" height="100"/>
    <rect x="1100" y="40" width="70" height="130"/>
    <rect x="1120" y="170" width="30" height="60"/>
    <rect x="1350" y="40" width="90" height="150"/>
    <rect x="1380" y="190" width="40" height="70"/>
  </g>

  <!-- Glowing Amber Crystals (Right Side Concentration) -->
  <g id="crystals">
    <!-- Crystal Cluster 1 Right -->
    <polygon points="1250,420 1270,300 1290,420" fill="#DFA035"/>
    <polygon points="1270,300 1290,420 1280,420" fill="#FFD480"/>
    <polygon points="1210,430 1230,330 1250,430" fill="#C4841D"/>
    <polygon points="1290,430 1315,310 1340,430" fill="#FFC04D"/>

    <!-- Crystal Cluster 2 Mid-Right -->
    <polygon points="980,440 995,360 1010,440" fill="#DFA035"/>
    <polygon points="1010,440 1025,340 1040,440" fill="#FFC04D"/>

    <!-- Ambient Amber Crystal Light Glow -->
    <circle cx="1270" cy="360" r="160" fill="url(#amberGlow02)"/>
  </g>

  <!-- Floating Pixel Energy Particles -->
  <g id="particles" fill="#FFD480" opacity="0.8">
    <rect x="1200" y="240" width="8" height="8"/>
    <rect x="1260" y="200" width="12" height="12"/>
    <rect x="1320" y="270" width="6" height="6"/>
    <rect x="1050" y="280" width="10" height="10"/>
    <rect x="940" y="230" width="6" height="6"/>
    <rect x="700" y="290" width="8" height="8"/>
  </g>

  <!-- Bedrock Floor & Avatar Overlap Zone (Bottom Left Kept Dark & Clear) -->
  <g id="bedrock">
    <rect x="0" y="440" width="1500" height="60" fill="#18130D"/>
    <rect x="0" y="420" width="600" height="20" fill="#241C13"/>
    <rect x="600" y="430" width="900" height="10" fill="#241C13"/>
  </g>
</svg>
