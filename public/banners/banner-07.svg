<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" shape-rendering="crispEdges">
  <title>PixelTalk Retro Pilot Profile Banner</title>
  <desc>Matching pixel cloudscape banner for avatar-07</desc>
  <defs>
    <linearGradient id="sunsetSky07" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B2012"/>
      <stop offset="35%" stop-color="#6E3511"/>
      <stop offset="70%" stop-color="#B85A21"/>
      <stop offset="90%" stop-color="#DFA035"/>
      <stop offset="100%" stop-color="#FCECD8"/>
    </linearGradient>
    <radialGradient id="sunGlow07" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF2E2" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#DFA035" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#844721" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Golden Sunset Sky Gradient -->
  <g id="sky">
    <rect width="1500" height="500" fill="url(#sunsetSky07)"/>

    <!-- Setting Golden Sun (Mid-Right) -->
    <circle cx="1150" cy="240" r="160" fill="url(#sunGlow07)"/>
  </g>

  <!-- Fluffy Stepped Sunset Clouds (Warm Cream & Terracotta) -->
  <g id="clouds" fill="#FCECD8" opacity="0.8">
    <!-- Top Cloud Layer -->
    <rect x="80" y="80" width="220" height="30"/>
    <rect x="130" y="55" width="120" height="25"/>

    <rect x="600" y="100" width="280" height="36"/>
    <rect x="660" y="70" width="160" height="30"/>

    <rect x="1180" y="70" width="240" height="30"/>
    <rect x="1230" y="45" width="140" height="25"/>
  </g>

  <!-- Pixel Biplane Silhouette (Upper Right Sky) -->
  <g id="biplane-silhouette" fill="#291408">
    <!-- Fuselage -->
    <rect x="1000" y="120" width="120" height="24"/>
    <!-- Propeller -->
    <rect x="1120" y="100" width="8" height="64"/>
    <!-- Tail Fin -->
    <polygon points="1000,120 970,90 1000,90"/>
    <!-- Upper Wing -->
    <rect x="1030" y="96" width="70" height="10"/>
    <!-- Lower Wing -->
    <rect x="1030" y="148" width="70" height="10"/>
    <!-- Wing Struts -->
    <rect x="1040" y="106" width="6" height="42"/>
    <rect x="1080" y="106" width="6" height="42"/>
  </g>

  <!-- Brass Compass & Altimeter Gauge Motifs (Far Right Background) -->
  <g id="altimeter-gauge" stroke="#DFA035" stroke-width="2" fill="none" opacity="0.4">
    <circle cx="1380" cy="220" r="70"/>
    <circle cx="1380" cy="220" r="60"/>
    <line x1="1380" y1="150" x2="1380" y2="290"/>
    <line x1="1310" y1="220" x2="1450" y2="220"/>
  </g>

  <!-- Lower Cloud Deck & Avatar Overlap Zone (Bottom Left) -->
  <g id="cloud-deck" fill="#54280E">
    <rect x="0" y="380" width="1500" height="120"/>
    <rect x="0" y="350" width="550" height="30"/>
    <rect x="550" y="365" width="950" height="15"/>

    <rect x="0" y="420" width="1500" height="80" fill="#3B1C0A"/>
  </g>
</svg>
