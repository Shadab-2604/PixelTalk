<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" shape-rendering="crispEdges">
  <title>PixelTalk Forest Ranger Profile Banner</title>
  <desc>Matching pixel autumn woods banner for avatar-08</desc>
  <defs>
    <linearGradient id="autumnSky08" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A120D"/>
      <stop offset="40%" stop-color="#3D2114"/>
      <stop offset="80%" stop-color="#6E3511"/>
      <stop offset="100%" stop-color="#8B5A2B"/>
    </linearGradient>
    <radialGradient id="fireGlow08" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF8C42" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#B84A39" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1A120D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Twilight Autumn Sky -->
  <g id="sky">
    <rect width="1500" height="500" fill="url(#autumnSky08)"/>

    <!-- Crescent Moon (Upper Right) -->
    <path d="M1300,50 A40,40 0 1 0 1340,90 A30,30 0 1 1 1300,50 Z" fill="#FFF2E2" opacity="0.9"/>

    <!-- Pixel Stars -->
    <g fill="#FFF2E2" opacity="0.6">
      <rect x="120" y="50" width="4" height="4"/>
      <rect x="340" y="80" width="6" height="6"/>
      <rect x="580" y="40" width="4" height="4"/>
      <rect x="840" y="60" width="6" height="6"/>
      <rect x="1100" y="90" width="4" height="4"/>
      <rect x="1420" y="40" width="6" height="6"/>
    </g>
  </g>

  <!-- Autumn Redwood & Oak Tree Silhouettes (Deep Amber & Crimson Leaves) -->
  <g id="autumn-trees">
    <!-- Tree Group 1 Left -->
    <rect x="60" y="220" width="20" height="200" fill="#2E180D"/>
    <polygon points="70,120 10,230 130,230" fill="#8B5A2B"/>
    <polygon points="70,160 20,260 120,260" fill="#B84A39"/>

    <rect x="180" y="240" width="16" height="180" fill="#2E180D"/>
    <polygon points="188,150 138,250 238,250" fill="#597928"/>
    <polygon points="188,190 148,270 228,270" fill="#8B5A2B"/>

    <!-- Tree Group 2 Far Right (Campfire Site) -->
    <rect x="1260" y="200" width="24" height="220" fill="#2E180D"/>
    <polygon points="1272,90 1202,220 1342,220" fill="#B84A39"/>
    <polygon points="1272,140 1212,250 1332,250" fill="#8B5A2B"/>

    <rect x="1380" y="230" width="18" height="190" fill="#2E180D"/>
    <polygon points="1389,130 1339,240 1439,240" fill="#597928"/>
  </g>

  <!-- Campfire Site & Glowing Embers (Right Side) -->
  <g id="campfire">
    <circle cx="1120" cy="380" r="160" fill="url(#fireGlow08)"/>

    <!-- Pixel Campfire Logs & Flames -->
    <rect x="1100" y="410" width="40" height="12" fill="#3D2114" transform="rotate(15 1120 416)"/>
    <rect x="1100" y="410" width="40" height="12" fill="#3D2114" transform="rotate(-15 1120 416)"/>
    <!-- Flames -->
    <polygon points="1120,350 1100,410 1140,410" fill="#FF8C42"/>
    <polygon points="1120,370 1110,410 1130,410" fill="#FFC04D"/>

    <!-- Floating Ember Sparks -->
    <g fill="#FFC04D">
      <rect x="1110" y="320" width="6" height="6"/>
      <rect x="1135" y="290" width="8" height="8"/>
      <rect x="1080" y="300" width="6" height="6"/>
      <rect x="1150" y="240" width="6" height="6"/>
      <rect x="1090" y="220" width="8" height="8"/>
      <rect x="1130" y="170" width="6" height="6"/>
    </g>
  </g>

  <!-- Dark Forest Soil & Overlap Protection (Bottom Left) -->
  <g id="forest-floor">
    <rect x="0" y="410" width="1500" height="90" fill="#1C110A"/>
    <rect x="0" y="380" width="650" height="30" fill="#2D1A0F"/>
  </g>
</svg>
