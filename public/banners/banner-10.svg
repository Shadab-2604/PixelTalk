<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" shape-rendering="crispEdges">
  <title>PixelTalk Golden Admin Profile Banner</title>
  <desc>Matching pixel royal palace banner for avatar-10</desc>
  <defs>
    <linearGradient id="royalSky10" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1F150A"/>
      <stop offset="45%" stop-color="#3B2A14"/>
      <stop offset="85%" stop-color="#6B4D22"/>
      <stop offset="100%" stop-color="#DFA035"/>
    </linearGradient>
    <radialGradient id="goldAura10" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF2E2" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#FFD700" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3B2A14" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Royal Palace Hall Background -->
  <g id="sky">
    <rect width="1500" height="500" fill="url(#royalSky10)"/>

    <!-- Glowing Golden Crown Crest (Upper Right) -->
    <circle cx="1150" cy="200" r="150" fill="url(#goldAura10)"/>
    <!-- Pixel Crown Silhouette -->
    <g fill="#FFD700">
      <rect x="1100" y="140" width="100" height="20"/>
      <polygon points="1090,140 1080,80 1110,120 1150,60 1190,120 1220,80 1210,140"/>
    </g>
  </g>

  <!-- Fluted Pixel Marble Pillars with Gold Capitals (Sides & Center) -->
  <g id="pillars">
    <!-- Left Pillar 1 -->
    <rect x="160" y="0" width="70" height="420" fill="#E8D5B7"/>
    <rect x="140" y="0" width="110" height="30" fill="#DFA035"/>
    <rect x="140" y="420" width="110" height="40" fill="#DFA035"/>
    <line x1="180" y1="30" x2="180" y2="420" stroke="#CBB492" stroke-width="4"/>
    <line x1="210" y1="30" x2="210" y2="420" stroke="#CBB492" stroke-width="4"/>

    <!-- Right Main Pillar -->
    <rect x="1300" y="0" width="80" height="420" fill="#E8D5B7"/>
    <rect x="1270" y="0" width="140" height="30" fill="#DFA035"/>
    <rect x="1270" y="420" width="140" height="40" fill="#DFA035"/>
    <line x1="1325" y1="30" x2="1325" y2="420" stroke="#CBB492" stroke-width="4"/>
    <line x1="1355" y1="30" x2="1355" y2="420" stroke="#CBB492" stroke-width="4"/>
  </g>

  <!-- Grand Palace Archway Roof (Upper Border) -->
  <g id="palace-arch" fill="#2E1F0F">
    <rect x="0" y="0" width="1500" height="40"/>
    <polygon points="0,40 750,120 1500,40"/>
    <polygon points="0,40 750,100 1500,40" fill="#DFA035" opacity="0.6"/>
  </g>

  <!-- Floating Golden Sparkles -->
  <g id="gold-sparkles" fill="#FFF2E2">
    <rect x="1020" y="140" width="8" height="8"/>
    <rect x="1070" y="240" width="10" height="10"/>
    <rect x="1190" y="110" width="8" height="8"/>
    <rect x="1260" y="220" width="6" height="6"/>
    <rect x="940" y="280" width="8" height="8"/>
    <rect x="750" y="210" width="6" height="6"/>
    <rect x="520" y="250" width="8" height="8"/>
  </g>

  <!-- Royal Floor & Overlap Protection (Bottom Left) -->
  <g id="royal-floor">
    <rect x="0" y="440" width="1500" height="60" fill="#1C1309"/>
    <rect x="0" y="410" width="650" height="30" fill="#2B1D0E"/>
    <!-- Gold Trim Line -->
    <line x1="0" y1="410" x2="1500" y2="410" stroke="#DFA035" stroke-width="4"/>
  </g>
</svg>
