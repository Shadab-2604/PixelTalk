<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" shape-rendering="crispEdges">
  <title>PixelTalk Pixel Mage Profile Banner</title>
  <desc>Matching pixel arcane observatory banner for avatar-04</desc>
  <defs>
    <linearGradient id="mageSky04" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#210A07"/>
      <stop offset="40%" stop-color="#42140D"/>
      <stop offset="85%" stop-color="#702619"/>
      <stop offset="100%" stop-color="#B84A39"/>
    </linearGradient>
    <radialGradient id="manaGlow04" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB68F" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#B84A39" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#210A07" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Cosmic Terracotta Twilight Sky -->
  <g id="sky">
    <rect width="1500" height="500" fill="url(#mageSky04)"/>

    <!-- Starry Pixel Nebula & Constellations -->
    <g fill="#FFD2BC">
      <rect x="180" y="60" width="6" height="6"/>
      <rect x="240" y="100" width="4" height="4"/>
      <rect x="360" y="40" width="6" height="6"/>
      <rect x="520" y="80" width="4" height="4"/>
      <rect x="740" y="50" width="6" height="6"/>
      <rect x="910" y="90" width="4" height="4"/>
      <rect x="1120" y="40" width="6" height="6"/>
      <rect x="1350" y="70" width="4" height="4"/>
    </g>
    <!-- Constellation Line Array -->
    <path d="M180,60 L240,100 L360,40 M910,90 L1120,40 L1350,70" stroke="#FFB68F" stroke-width="1.5" opacity="0.4" fill="none"/>
  </g>

  <!-- Floating Arcane Mana Crystals & Spells (Right Side) -->
  <g id="mana-crystals">
    <!-- Main Glowing Mana Gem -->
    <polygon points="1200,200 1230,130 1260,200 1230,270" fill="#FFB68F"/>
    <polygon points="1230,130 1260,200 1230,270" fill="#B84A39"/>
    <circle cx="1230" cy="200" r="140" fill="url(#manaGlow04)"/>

    <!-- Secondary Small Gems -->
    <polygon points="1060,160 1075,110 1090,160 1075,210" fill="#FFB68F"/>
    <polygon points="1340,280 1355,230 1370,280 1355,330" fill="#FFB68F"/>
  </g>

  <!-- Arcane Observatory Towers (Geometric Copper Pixel Structures) -->
  <g id="observatory-towers" fill="#3D140D">
    <!-- Right Main Tower -->
    <rect x="1280" y="240" width="160" height="260"/>
    <polygon points="1360,140 1260,240 1460,240" fill="#5C1F15"/>
    <rect x="1330" y="290" width="60" height="90" fill="#FFB68F" opacity="0.8"/>
    <rect x="1340" y="300" width="40" height="70" fill="#FFF0E8"/>

    <!-- Left Distant Spire -->
    <rect x="300" y="280" width="90" height="220"/>
    <polygon points="345,180 280,280 410,280" fill="#5C1F15"/>
  </g>

  <!-- Floating Magic Runes / Embers -->
  <g id="magic-embers" fill="#FFB68F">
    <rect x="1100" y="240" width="8" height="8"/>
    <rect x="1150" y="160" width="10" height="10"/>
    <rect x="1280" y="120" width="6" height="6"/>
    <rect x="980" y="290" width="8" height="8"/>
    <rect x="750" y="320" width="6" height="6"/>
  </g>

  <!-- Dark Base & Overlap Protection (Bottom Left) -->
  <g id="base-ground">
    <rect x="0" y="420" width="1500" height="80" fill="#1C0805"/>
    <rect x="0" y="390" width="600" height="30" fill="#2E0E09"/>
  </g>
</svg>
