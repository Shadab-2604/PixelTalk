<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" shape-rendering="crispEdges">
  <title>PixelTalk Moss Knight Profile Banner</title>
  <desc>Matching pixel fortress banner for avatar-03</desc>
  <defs>
    <linearGradient id="mossSky03" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A1404"/>
      <stop offset="60%" stop-color="#192A0D"/>
      <stop offset="100%" stop-color="#31451A"/>
    </linearGradient>
    <radialGradient id="runeGlow03" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D0EDA1" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#AED376" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#426010" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dark Emerald Night Sky -->
  <g id="sky">
    <rect width="1500" height="500" fill="url(#mossSky03)"/>
    <!-- Pixel Stars -->
    <g fill="#D0EDA1" opacity="0.6">
      <rect x="150" y="50" width="4" height="4"/>
      <rect x="320" y="90" width="6" height="6"/>
      <rect x="580" y="40" width="4" height="4"/>
      <rect x="820" y="70" width="6" height="6"/>
      <rect x="1050" y="30" width="4" height="4"/>
      <rect x="1380" y="80" width="6" height="6"/>
    </g>
    <!-- Pixel Moon -->
    <rect x="1250" y="50" width="70" height="70" fill="#E8F8CE" opacity="0.85"/>
    <rect x="1240" y="60" width="90" height="50" fill="#E8F8CE" opacity="0.85"/>
  </g>

  <!-- Glowing Lime Runic Knight Crest (Upper Right) -->
  <g id="runic-crest">
    <circle cx="1080" cy="200" r="140" fill="url(#runeGlow03)"/>
    <!-- Shield & Sword Pixel Outline -->
    <g fill="#AED376" opacity="0.7">
      <rect x="1070" y="100" width="20" height="180"/>
      <rect x="1030" y="140" width="100" height="20"/>
      <polygon points="1080,290 1020,180 1140,180"/>
    </g>
  </g>

  <!-- Ancient Stone Fortress Castle Ramparts (Deep Emerald & Slate) -->
  <g id="castle-ramparts" fill="#243315">
    <!-- Background Towers -->
    <rect x="200" y="180" width="120" height="320"/>
    <rect x="180" y="160" width="160" height="30"/>
    <!-- Turret Battlements -->
    <rect x="180" y="130" width="30" height="30"/>
    <rect x="245" y="130" width="30" height="30"/>
    <rect x="310" y="130" width="30" height="30"/>

    <rect x="1280" y="160" width="150" height="340"/>
    <rect x="1260" y="140" width="190" height="30"/>
    <rect x="1260" y="110" width="35" height="30"/>
    <rect x="1335" y="110" width="35" height="30"/>
    <rect x="1415" y="110" width="35" height="30"/>
  </g>

  <!-- Foreground Wall with Moss Details -->
  <g id="moss-walls">
    <rect x="0" y="340" width="1500" height="160" fill="#18260D"/>
    <!-- Stone Block Lines -->
    <g stroke="#31451A" stroke-width="3">
      <line x1="0" y1="390" x2="1500" y2="390"/>
      <line x1="0" y1="440" x2="1500" y2="440"/>
      <line x1="200" y1="340" x2="200" y2="390"/>
      <line x1="600" y1="340" x2="600" y2="390"/>
      <line x1="1000" y1="340" x2="1000" y2="390"/>
      <line x1="400" y1="390" x2="400" y2="440"/>
      <line x1="800" y1="390" x2="800" y2="440"/>
      <line x1="1200" y1="390" x2="1200" y2="440"/>
    </g>

    <!-- Moss Vegetation Patches (Lime & Emerald) -->
    <rect x="180" y="375" width="60" height="15" fill="#597928"/>
    <rect x="190" y="370" width="40" height="10" fill="#AED376"/>
    <rect x="780" y="425" width="80" height="15" fill="#597928"/>
    <rect x="795" y="420" width="50" height="10" fill="#AED376"/>
    <rect x="1180" y="375" width="70" height="15" fill="#597928"/>
  </g>

  <!-- Floating Spore Particles -->
  <g id="spores" fill="#D0EDA1" opacity="0.8">
    <rect x="300" y="280" width="6" height="6"/>
    <rect x="450" y="240" width="8" height="8"/>
    <rect x="720" y="290" width="6" height="6"/>
    <rect x="920" y="210" width="8" height="8"/>
    <rect x="1150" y="260" width="6" height="6"/>
  </g>
</svg>
