<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" shape-rendering="crispEdges">
  <title>PixelTalk Earth Scout Profile Banner</title>
  <desc>Matching pixel wilderness banner for avatar-01</desc>
  <defs>
    <linearGradient id="sky01" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2D461E"/>
      <stop offset="45%" stop-color="#4E6E2E"/>
      <stop offset="80%" stop-color="#7B9E45"/>
      <stop offset="100%" stop-color="#FCECD8"/>
    </linearGradient>
    <linearGradient id="sunGlow01" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF5E4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F5D6A0" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <g id="sky">
    <rect width="1500" height="500" fill="url(#sky01)"/>
    <!-- Rising Sun Circle -->
    <rect x="1100" y="80" width="160" height="160" fill="url(#sunGlow01)"/>
    <rect x="1120" y="60" width="120" height="200" fill="url(#sunGlow01)"/>
    <!-- Sun Rays Pixel Grid -->
    <rect x="1050" y="150" width="260" height="20" fill="#FFF5E4" opacity="0.3"/>
    <rect x="1170" y="30" width="20" height="260" fill="#FFF5E4" opacity="0.3"/>
  </g>

  <!-- Floating Pixel Clouds -->
  <g id="clouds" fill="#FCECD8" opacity="0.85">
    <!-- Cloud 1 Left -->
    <rect x="120" y="70" width="160" height="24"/>
    <rect x="150" y="50" width="100" height="20"/>
    <rect x="180" y="36" width="50" height="14"/>
    <!-- Cloud 2 Center -->
    <rect x="580" y="90" width="220" height="30"/>
    <rect x="620" y="66" width="140" height="24"/>
    <rect x="660" y="50" width="70" height="16"/>
    <!-- Cloud 3 Right -->
    <rect x="1220" y="110" width="180" height="26"/>
    <rect x="1260" y="88" width="100" height="22"/>
  </g>

  <!-- Distant Pixel Mountains (Dark Green Silhouettes) -->
  <g id="distant-mountains" fill="#203314">
    <!-- Peak 1 -->
    <polygon points="100,500 280,240 460,500"/>
    <polygon points="240,500 400,280 560,500"/>
    <!-- Peak 2 -->
    <polygon points="750,500 950,220 1150,500"/>
    <polygon points="980,500 1140,290 1300,500"/>
  </g>

  <!-- Midground Hills & Trees (Earthy Greens) -->
  <g id="midground-hills" fill="#385221">
    <rect x="0" y="360" width="1500" height="140"/>
    <rect x="0" y="320" width="500" height="40"/>
    <rect x="600" y="330" width="900" height="30"/>
    <rect x="900" y="300" width="600" height="30"/>
  </g>

  <!-- Pixel Pines (Left & Right Flanks) -->
  <g id="pine-trees" fill="#1D2E12">
    <!-- Tree 1 Left -->
    <rect x="40" y="260" width="16" height="120"/>
    <polygon points="48,160 10,240 86,240"/>
    <polygon points="48,200 18,270 78,270"/>
    <polygon points="48,230 26,300 70,300"/>
    <!-- Tree 2 Left -->
    <rect x="130" y="280" width="14" height="100"/>
    <polygon points="137,190 105,260 169,260"/>
    <polygon points="137,230 112,290 162,290"/>
    <!-- Tree 3 Right -->
    <rect x="1360" y="240" width="18" height="140"/>
    <polygon points="1369,130 1326,220 1412,220"/>
    <polygon points="1369,170 1334,260 1404,260"/>
    <polygon points="1369,210 1342,290 1396,290"/>
    <!-- Tree 4 Right -->
    <rect x="1270" y="270" width="14" height="110"/>
    <polygon points="1277,180 1245,250 1309,250"/>
    <polygon points="1277,220 1252,280 1302,280"/>
  </g>

  <!-- Compass Rose Grid (Upper Right) -->
  <g id="compass-details" fill="#FCECD8" opacity="0.4">
    <rect x="1350" y="40" width="6" height="40"/>
    <rect x="1333" y="57" width="40" height="6"/>
    <rect x="1347" y="54" width="12" height="12"/>
  </g>

  <!-- Foreground Earth Layer & Soft Shadow overlay for Avatar Overlap (Bottom Left) -->
  <g id="foreground">
    <rect x="0" y="410" width="1500" height="90" fill="#293D19"/>
    <!-- Pixel Grass Blades -->
    <rect x="60" y="396" width="6" height="14" fill="#597928"/>
    <rect x="140" y="398" width="6" height="12" fill="#597928"/>
    <rect x="240" y="394" width="8" height="16" fill="#597928"/>
    <rect x="1200" y="396" width="6" height="14" fill="#597928"/>
    <rect x="1420" y="394" width="8" height="16" fill="#597928"/>
  </g>
</svg>
