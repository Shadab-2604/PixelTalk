<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" shape-rendering="crispEdges">
  <title>PixelTalk Neon Ninja Profile Banner</title>
  <desc>Matching pixel shinobi rooftop banner for avatar-09</desc>
  <defs>
    <linearGradient id="ninjaSky09" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#120A0E"/>
      <stop offset="50%" stop-color="#261016"/>
      <stop offset="100%" stop-color="#40141C"/>
    </linearGradient>
    <radialGradient id="bloodMoonGlow09" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E64A38" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#B84A39" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#120A0E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Midnight Shinobi Crimson Sky -->
  <g id="sky">
    <rect width="1500" height="500" fill="url(#ninjaSky09)"/>

    <!-- Crimson Blood Moon (Upper Center-Right) -->
    <circle cx="1100" cy="180" r="140" fill="url(#bloodMoonGlow09)"/>
    <rect x="1040" y="120" width="120" height="120" fill="#E64A38" opacity="0.8"/>

    <!-- Pixel Stars -->
    <g fill="#FFF2F4" opacity="0.7">
      <rect x="140" y="60" width="4" height="4"/>
      <rect x="380" y="90" width="6" height="6"/>
      <rect x="620" y="40" width="4" height="4"/>
      <rect x="860" y="70" width="6" height="6"/>
      <rect x="1320" y="50" width="6" height="6"/>
    </g>
  </g>

  <!-- Japanese Pagoda Rooftop Silhouettes (Deep Black & Crimson) -->
  <g id="pagodas" fill="#120A0D">
    <!-- Left Pagoda Spire -->
    <rect x="220" y="220" width="100" height="280"/>
    <!-- Eaves Level 1 -->
    <polygon points="270,160 160,230 380,230"/>
    <!-- Eaves Level 2 -->
    <polygon points="270,220 180,270 360,270"/>
    <!-- Top Finial Spike -->
    <rect x="265" y="110" width="10" height="50" fill="#B84A39"/>

    <!-- Right Main Pagoda -->
    <rect x="1220" y="180" width="160" height="320"/>
    <polygon points="1300,100 1160,190 1440,190"/>
    <polygon points="1300,180 1190,250 1410,250"/>
    <polygon points="1300,240 1210,300 1390,300"/>
    <rect x="1295" y="50" width="10" height="50" fill="#B84A39"/>
  </g>

  <!-- Falling Crimson Sakura / Neon Petals -->
  <g id="sakura-petals" fill="#FF7B6B">
    <rect x="180" y="120" width="8" height="6"/>
    <rect x="290" y="180" width="6" height="8"/>
    <rect x="420" y="140" width="8" height="6"/>
    <rect x="580" y="220" width="6" height="8"/>
    <rect x="740" y="160" width="8" height="6"/>
    <rect x="890" y="240" width="6" height="8"/>
    <rect x="1010" y="130" width="8" height="6"/>
    <rect x="1180" y="210" width="6" height="8"/>
    <rect x="1340" y="150" width="8" height="6"/>
    <rect x="1410" y="260" width="6" height="8"/>
  </g>

  <!-- Foreground Roof Slopes & Avatar Overlap Protection (Bottom Left) -->
  <g id="foreground-roofs">
    <polygon points="0,380 400,320 600,500 0,500" fill="#1A0D13"/>
    <rect x="0" y="420" width="1500" height="80" fill="#0C0609"/>
    <!-- Crimson Roof Edge Highlight -->
    <line x1="0" y1="380" x2="400" y2="320" stroke="#B84A39" stroke-width="4"/>
  </g>
</svg>
